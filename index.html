<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">

  <title>PC Forge — Конфигуратор ПК</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cards.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>

  <!-- ШАПКА -->
  <header class="header">
    <div class="logo">PC <span>FORGE</span></div>
    <p class="header-label">СОБЕРИ СВОЮ ИДЕАЛЬНУЮ СИСТЕМУ</p>
  </header>

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-badge">
        <span class="pulse-dot"></span>
        PC BUILDER / 2026
      </div>

      <h1>
        Твоя мощность.<br>
        <span>Твои правила.</span>
      </h1>

      <p>
        Подбирай комплектующие, проверяй совместимость
        и собирай компьютер мечты.
      </p>

      <a class="hero-cta" href="#builder">
        Начать сборку <span>↓</span>
      </a>
    </div>

    <div class="hero-orbit" aria-hidden="true">
      <div class="orbit-ring ring-one"></div>
      <div class="orbit-ring ring-two"></div>
      <div class="orbit-core">PF<span>✦</span></div>
    </div>
  </section>

  <!-- ОСНОВНОЙ КОНФИГУРАТОР -->
  <main class="container" id="builder">

    <!-- КОМПЛЕКТУЮЩИЕ -->
    <section class="components">

      <div class="section-heading">
        <div>
          <div class="eyebrow">КОНФИГУРАТОР</div>
          <h2>Комплектующие</h2>
          <p class="section-subtitle">
            Выбери детали для своей системы
          </p>
        </div>

        <div class="builder-chip">
          <span
